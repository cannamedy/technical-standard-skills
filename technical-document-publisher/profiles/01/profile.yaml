profile:
  number: "01"
  id: technical-whitepaper
  version: "1.0.0"
  name: 技术白皮书
page:
  size: A4
  margins_cm: 2.0
fonts:
  cjk: null
  latin: null
  monospace: null
  resolution_policy: require-explicit-available-fonts-before-build
roles:
  chapter_style: Heading 1
  major_section_style: Heading 2
  technical_topic_style: Heading 3
title:
  style: Title
  size_pt: 26
  color: "000000"
  line_spacing: 1.2
body:
  size_pt: 11
  line_spacing: 1.3
  paragraph_spacing_pt: 5
headings:
  h1: {size_pt: 19, bold: true, space_before_pt: 16, space_after_pt: 8, keep_with_next: true}
  h2: {size_pt: 15.5, bold: true, space_before_pt: 12, space_after_pt: 6, keep_with_next: true}
  h3: {size_pt: 13, bold: true, space_before_pt: 8, space_after_pt: 5, keep_with_next: true}
  h4: {size_pt: 11.5, bold: true, space_before_pt: 6, space_after_pt: 4, keep_with_next: true}
  h5: {size_pt: 11, bold: true, space_before_pt: 5, space_after_pt: 3, keep_with_next: true}
  h6: {size_pt: 11, bold: true, space_before_pt: 4, space_after_pt: 3, keep_with_next: true}
  numbering_policy: source-level-only
  page_break_before: false
code:
  size_pt: 9
  preserve_whitespace: true
  keep_together: short-blocks
  wrapping: preserve-lines
ascii_diagram:
  size_pt: 9
  preserve_whitespace: true
  keep_together: true
lists:
  ordered_restart_policy: per-markdown-block
  nesting: preserve-source-indent
  hanging_indent_cm: 0.25
  paragraph_spacing_pt: 1
labels:
  size_pt: 11
  bold: true
  space_before_pt: 4
  space_after_pt: 5
tables:
  repeat_header: true
  font_size_pt: 9.5
  widths: semantic-content
  borders: light
  fixed_row_height: false
toc:
  enabled: true
  depth: 3
  update_fields: true
  verify_entries: true
  require_page_numbers: true
  leader: dots
  toc1: {style: "TOC 1", size_pt: 10, bold: true, left_indent_cm: 0}
  toc2: {style: "TOC 2", size_pt: 9.5, bold: false, left_indent_cm: 0.5}
  toc3: {style: "TOC 3", size_pt: 9, bold: false, left_indent_cm: 1.0}
footer:
  page_numbers: true
visual:
  profile_family: technical-whitepaper
  minimum_h1_body_ratio: 1.4
  minimum_h2_body_ratio: 1.2
  minimum_h3_body_ratio: 1.08
  direct_formatting_warning_ratio: 0.35
  direct_formatting_fail_ratio: 0.75
  minimum_topic_body_distance: 0.18
  minimum_local_label_body_distance: 0.10
  hierarchy_gate: true
  perceptual_hierarchy_gate: true
  black_and_white_gate: true
  cross_renderer_policy: report-if-not-verified
